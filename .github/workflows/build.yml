name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read only unless a job asks for more: the release alone writes
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # every action is pinned to the commit of its release, the tag only stated beside it:
      # a tag can be moved, a commit cannot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # the version requirements.lock was compiled for
          python-version: '3.14'
      # the sources are fetched at the commits UPSTREAM.txt names
      - run: ./fetch.sh
      # every package, its dependencies included, at the version and with the hashes of
      # requirements.lock: pip refuses any file whose hash differs
      - run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - run: python build.py
      - run: python check.py
      - run: cd dist && sha256sum *.ttf > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carbone-emoji
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: carbone-emoji
          path: dist/
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/CarboneEmoji-Color.ttf
            dist/CarboneEmoji-Mono.ttf
            dist/SHA256SUMS
            LICENSE
