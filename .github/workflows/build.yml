name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./fetch.sh
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - run: python check.py
      - run: cd dist && sha256sum *.ttf > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: carbone-emoji
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CarboneEmoji-Color.ttf
            dist/CarboneEmoji-Mono.ttf
            dist/SHA256SUMS
            LICENSE
